[theme]
id = phosphor-dos
name = DOS VGA
author = Hacker Terminal (inspirado no Cool Retro Term)
font = Terminus

[interface]
background = #070707
surface = #0e0e0e
foreground = #e1e1e1
accent = #c8c8c8
border = #4c4c4c
muted = #7c7c7c
danger = #f16c6c

[terminal]
background = #000000
foreground = #c8c8c8
cursor = #dbdbdb
selection_background = #b0b0b0
selection_foreground = #000000
ansi = #000000, #ec0000, #00aa00, #b75b00, #5c69e0, #c039c0, #00aaaa, #aaaaaa, #646464, #ff5555, #55ff55, #ffff55, #5f5fff, #ff55ff, #55ffff, #ffffff

[effects]
matrix_color = #c8c8c8
scanline_opacity = 0.1
glow = 0.25
vignette = 0.45
noise = 0.06
flicker = 0.05
curvature = 0.35
rain = false
