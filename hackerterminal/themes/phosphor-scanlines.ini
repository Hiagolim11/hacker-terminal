[theme]
id = phosphor-scanlines
name = Fósforo Verde Scanlines
author = Hacker Terminal (inspirado no Cool Retro Term)
font = Terminus

[interface]
background = #040903
surface = #091206
foreground = #b7ff9e
accent = #7cff4f
border = #2f611e
muted = #48942e
danger = #de7a4e

[terminal]
background = #030a01
foreground = #7cff4f
cursor = #aaff8d
selection_background = #6de046
selection_foreground = #030a01
ansi = #16310d, #52a834, #5cbd3a, #6bdb44, #48942e, #57b237, #63cc3f, #70e647, #377422, #68d642, #72eb49, #7cff4f, #61c73e, #6de046, #9dff7b, #c4ffb0

[effects]
matrix_color = #7cff4f
scanline_opacity = 0.32
glow = 0.6
vignette = 0.5
noise = 0.1
flicker = 0.08
curvature = 0.4
rain = false
